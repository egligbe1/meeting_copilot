[project]
name = "interview-copilot"
version = "0.1.0"
description = "Real-time answer guidance for technical and behavioral interviews"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7.0",
    "sounddevice>=0.4.7",
    "numpy>=1.26.0",
    "groq>=0.9.0",
    "keyring>=25.0.0",
    "pystray>=0.19.5",
    "Pillow>=10.3.0",
]

[project.gui-scripts]
interview-copilot = "meeting_copilot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meeting_copilot"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-mock>=3.14",
    "ruff>=0.4",
    "mypy>=1.10",
    "pyinstaller>=6.8",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
